apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fleet-dashboard
  template:
    metadata:
      labels:
        app: fleet-dashboard
    spec:
      containers:
        - name: fleet-dashboard
          image: ghcr.io/mtepenner/airframe-lifecycle-tracker-dashboard:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-dashboard
spec:
  selector:
    app: fleet-dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
