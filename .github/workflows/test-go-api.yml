name: test-go-api

on:
  push:
    paths:
      - analytics_engine/**
      - .github/workflows/test-go-api.yml
  pull_request:
    paths:
      - analytics_engine/**

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Download dependencies
        run: go mod download
      - name: Run unit tests
        run: go test ./...
